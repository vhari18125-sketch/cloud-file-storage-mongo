<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard - Cloud File Storage</title>
  <link href="style.css" rel="stylesheet" />
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #74ebd5, #9face6);
      margin: 0;
      padding: 0;
      color: #222;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      background: white;
      width: 90%;
      max-width: 900px;
      margin-top: 50px;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
    }

    h1 {
      text-align: center;
      color: #333;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th, td {
      text-align: left;
      padding: 12px 15px;
      border-bottom: 1px solid #ddd;
    }

    th {
      background-color: #4a90e2;
      color: white;
    }

    tr:hover {
      background-color: #f2f2f2;
    }

    button {
      border: none;
      padding: 8px 12px;
      margin: 3px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    button.download {
      background-color: #28a745;
      color: white;
    }

    button.delete {
      background-color: #e74c3c;
      color: white;
    }

    button:hover {
      transform: scale(1.05);
    }

    .logout-btn {
      background-color: #ff6b6b;
      color: white;
      padding: 10px 20px;
      border-radius: 8px;
      margin-top: 20px;
    }

    .logout-btn:hover {
      background-color: #ff5252;
    }

    .footer {
      text-align: center;
      margin-top: 30px;
      color: #555;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>🛠 Admin Dashboard</h1>
    <table id="fileTable">
      <thead>
        <tr>
          <th>File Name</th>
          <th>Size (KB)</th>
          <th>Uploaded By</th>
          <th>Upload Date</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="fileRows"></tbody>
    </table>

    <button class="logout-btn" onclick="logout()">🚪 Logout</button>
  </div>

  <div class="footer">Cloud File Storage © 2025</div>

  <script>
    const token = localStorage.getItem("token");
    if (!token) window.location.href = "login.html";

    async function fetchFiles() {
      const res = await fetch("/api/files", {
        headers: { Authorization: `Bearer ${token}` },
      });
      const files = await res.json();

      const tableBody = document.getElementById("fileRows");
      tableBody.innerHTML = files.map(f => `
        <tr>
          <td>${f.originalName}</td>
          <td>${(f.size / 1024).toFixed(1)}</td>
          <td>${f.uploadedBy?.email || "Unknown"}</td>
          <td>${new Date(f.uploadDate).toLocaleString()}</td>
          <td>
            <button class="download" onclick="downloadFile('${f._id}')">⬇️</button>
            <button class="delete" onclick="deleteFile('${f._id}')">🗑️</button>
          </td>
        </tr>
      `).join("");
    }

    async function downloadFile(id) {
      window.location.href = `/api/files/download/${id}`;
    }

    async function deleteFile(id) {
      if (!confirm("Are you sure you want to delete this file?")) return;
      const res = await fetch(`/api/files/${id}`, {
        method: "DELETE",
        headers: { Authorization: `Bearer ${token}` },
      });
      const data = await res.json();
      alert(data.message);
      fetchFiles();
    }

    function logout() {
      localStorage.removeItem("token");
      window.location.href = "login.html";
    }

    fetchFiles();
  </script>
</body>
</html>
