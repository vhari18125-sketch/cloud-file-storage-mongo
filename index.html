<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloud File Storage</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f0f2f5;
      margin: 30px;
    }
    h1 {
      color: #333;
    }
    form {
      margin-bottom: 30px;
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      display: inline-block;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    table {
      margin: auto;
      background: white;
      border-collapse: collapse;
      width: 80%;
    }
    th, td {
      padding: 10px;
      border: 1px solid #ddd;
    }
    th {
      background-color: #007bff;
      color: white;
    }
    a, button {
      text-decoration: none;
      color: #007bff;
      font-weight: bold;
      background: none;
      border: none;
      cursor: pointer;
    }
    button:hover, a:hover {
      color: red;
    }
  </style>
</head>
<body>

  <h1>☁️ Cloud File Storage</h1>

  <form id="uploadForm" enctype="multipart/form-data">
    <h2>📁 Upload a File to Cloud Storage</h2>
    <input type="file" name="file" id="fileInput" required />
    <button type="submit">Upload</button>
  </form>

  <h2>📂 Uploaded Files</h2>
  <table id="fileTable">
    <tr>
      <th>Name</th>
      <th>Size (bytes)</th>
      <th>Uploaded On</th>
      <th>Action</th>
    </tr>
  </table>

  <script>
    // Upload file
    document.getElementById("uploadForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const formData = new FormData();
      formData.append("file", document.getElementById("fileInput").files[0]);

      const res = await fetch("/upload", { method: "POST", body: formData });
      const data = await res.json();
      alert(data.message);
      loadFiles();
    });

    // Load and display files
    async function loadFiles() {
      const res = await fetch("/files");
      const files = await res.json();
      const table = document.getElementById("fileTable");
      table.innerHTML = `
        <tr>
          <th>Name</th>
          <th>Size (bytes)</th>
          <th>Uploaded On</th>
          <th>Action</th>
        </tr>
      `;

      files.forEach(file => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${file.name}</td>
          <td>${file.size}</td>
          <td>${new Date(file.uploadDate).toLocaleString()}</td>
          <td>
            <a href="/files/${file._id}" target="_blank">👁️ View</a> |
            <button onclick="deleteFile('${file._id}')">🗑️ Delete</button>
          </td>
        `;
        table.appendChild(row);
      });
    }

    // Delete file
    async function deleteFile(id) {
      if (confirm("Are you sure you want to delete this file?")) {
        const res = await fetch(`/files/${id}`, { method: "DELETE" });
        const result = await res.json();
        alert(result.message);
        loadFiles();
      }
    }

    // Auto-refresh file list every 10 seconds
    loadFiles();
    setInterval(loadFiles, 10000);
  </script>

</body>
</html>
